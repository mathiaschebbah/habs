name: Raw CURATED EEG experiment
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  HABS_KEY: "1f4d7f20-8ba2-4697-91cc-b898558a458c"
  HABS_STORAGE: sthabshackweu
  HABS_TENANT_ID: 6fc0e479-449c-4700-b89c-7c4848058e30
  HABS_CLIENT: "habs-hack[storage] @ git+https://github.com/HABS-BRAIN/habs-hack@main"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      job: ${{ steps.submit.outputs.job }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt pyarrow "$HABS_CLIENT"
      - id: submit
        shell: bash
        run: |
          stage="$RUNNER_TEMP/raw-study"
          mkdir -p "$stage"
          git archive 501d24b decoding habs requirements.txt | tar -x -C "$stage"
          cp -R src/habs_stress "$stage/"
          cp tools/raw_gpu.py "$stage/process.py"
          PYTHONPATH=src python tools/prepare_raw_grid.py "$stage/grid.parquet"
          habs submit --source "$stage" --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --until built
  extract:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "$HABS_CLIENT"
      - name: Wait for private feature extraction
        env:
          JOB_SUFFIX: ${{ needs.build.outputs.job }}
        run: habs watch "$JOB_SUFFIX"
      - name: Export aggregate coverage
        env:
          JOB_SUFFIX: ${{ needs.build.outputs.job }}
        run: |
          az storage blob download --auth-mode login --account-name "$HABS_STORAGE" --container-name "$HABS_KEY" --name "out/${HABS_KEY}--${JOB_SUFFIX}/public/raw_coverage.json" --file raw_coverage.json --no-progress
      - uses: actions/upload-artifact@v4
        with:
          name: raw-coverage
          path: raw_coverage.json
