name: Autoresearch

# One dispatch scores one or more experiment commits. The harness (prepare.py,
# data, metric) always comes from main; only autoresearch/train.py is taken from
# each experiment commit, so an experiment cannot change how it is scored.
# Logs and artifacts carry aggregate metrics only; trial rows stay on the runner.
on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Space-separated experiment commit SHAs"
        required: true
      split:
        type: choice
        options: [dev, test]
        default: dev
        description: "dev = loop objective; test = one-time sealed evaluation of all refs together"
      source_job:
        description: "Completed HABS job holding autoresearch/trials.parquet"
        required: true

permissions:
  contents: read
  id-token: write

env:
  HABS_KEY: "1f4d7f20-8ba2-4697-91cc-b898558a458c"
  HABS_STORAGE: sthabshackweu
  HABS_TENANT_ID: 6fc0e479-449c-4700-b89c-7c4848058e30
  AUTORESEARCH_DATA: /tmp/autoresearch
  SOURCE_JOB: ${{ inputs.source_job }}
  OMP_NUM_THREADS: "4"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - id: refs
        env:
          REFS: ${{ inputs.refs }}
          SPLIT: ${{ inputs.split }}
        run: |
          for ref in $REFS; do [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]] || exit 1; done
          # test scores all refs in one job so they are compared on the same fit
          if [ "$SPLIT" = test ]; then
            echo "refs=$(jq -cn --arg r "$REFS" '[$r]')" >> "$GITHUB_OUTPUT"
          else
            echo "refs=$(jq -cn --arg r "$REFS" '$r | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          fi

  score:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        ref: ${{ fromJson(needs.plan.outputs.refs) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Take train.py from each experiment commit
        env:
          REFS: ${{ matrix.ref }}
        run: |
          mkdir -p candidates
          for ref in $REFS; do git show "$ref:autoresearch/train.py" > "candidates/$ref.py"; done
          ls candidates
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autoresearch/requirements.txt
      - run: pip install --quiet -r autoresearch/requirements.txt "habs-hack[storage] @ git+https://github.com/HABS-BRAIN/habs-hack@main"
      - run: pip install --quiet --no-deps -e .
      - run: python tools/fetch_autoresearch_table.py
      - name: Score
        env:
          REFS: ${{ matrix.ref }}
          SPLIT: ${{ inputs.split }}
        run: |
          files=""; for ref in $REFS; do files="$files candidates/$ref.py"; done
          python -m autoresearch.prepare --split "$SPLIT" --train $files --out results 2>&1 | tee run.log
          { echo '```'; grep -E '^(score|valence|arousal|fit_seconds)' run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ inputs.split }}-${{ strategy.job-index }}
          path: results/*_metrics.json
          retention-days: 30
