name: HABS

on:
  workflow_dispatch:
    inputs:
      inspect_job:
        description: "Existing job suffix to inspect without submitting another run"
        required: false
        default: ""
      cancel_job:
        description: "Queued or running team job suffix to cancel"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  HABS_KEY: "1f4d7f20-8ba2-4697-91cc-b898558a458c"
  HABS_TENANT_ID: 6fc0e479-449c-4700-b89c-7c4848058e30
  HABS_STORAGE: sthabshackweu
  HABS_CLIENT: "habs-hack[storage] @ git+https://github.com/HABS-BRAIN/habs-hack@main"

jobs:
  build:
    name: build your image
    if: github.repository != 'HABS-BRAIN/habs-hackathon-template' && inputs.inspect_job == '' && inputs.cancel_job == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      job: ${{ steps.submit.outputs.job }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "$HABS_CLIENT"
      - id: submit
        run: habs submit --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --until built

  run:
    name: run on a GPU
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "$HABS_CLIENT"
      - run: habs watch "${{ needs.build.outputs.job }}"
      - name: Download publication-safe outputs only
        env:
          JOB_SUFFIX: ${{ needs.build.outputs.job }}
        run: |
          mkdir -p results
          for extension in json png; do
            az storage blob download-batch --auth-mode login --account-name "$HABS_STORAGE" --source "$HABS_KEY" --pattern "out/${HABS_KEY}--${JOB_SUFFIX}/public/*.${extension}" --destination results --no-progress
          done
      - uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: results/**/public/
          if-no-files-found: error
          retention-days: 30

  inspect:
    name: inspect existing HABS job
    if: inputs.inspect_job != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOB_SUFFIX: ${{ inputs.inspect_job }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "$HABS_CLIENT"
      - run: habs status
      - run: habs logs "${HABS_KEY}--${JOB_SUFFIX}"

  cancel:
    name: cancel a HABS job
    if: inputs.cancel_job != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOB_SUFFIX: ${{ inputs.cancel_job }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "$HABS_CLIENT"
      - run: |
          [[ "$JOB_SUFFIX" =~ ^[0-9]{8}T[0-9]{6}-[0-9a-f]{6}$ ]] || exit 1
          habs cancel "${HABS_KEY}--${JOB_SUFFIX}"
