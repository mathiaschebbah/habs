name: Code checks

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "results/**"
      - "process.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/check.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet ruff setuptools -r requirements.txt
      - run: pip install --quiet --no-deps --no-build-isolation -e .
      - run: ruff check src scripts tests process.py
      - run: pytest -q
