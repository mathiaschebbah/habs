name: Publication Revision CPU (P1-P3)

on:
  workflow_dispatch:
    inputs:
      analysis:
        type: choice
        options: [primary, order-diagnostic, same-fit]
        default: primary
        description: "Primary experiments or exploratory fold-score diagnostic"
      source_job:
        description: "Plus-separated completed HABS job suffixes holding features/*.parquet"
        required: false
        default: "20261119T195319-d95b8d+20261119T204649-527dc2+20261119T230123-4e5f45+20261123T004720-2ea585+20261124T102049-806609"
      repeats:
        description: "Subsampling repeats for Priority 1 matched-N ladder"
        required: false
        default: "10"

permissions:
  contents: read
  id-token: write

env:
  HABS_KEY: "1f4d7f20-8ba2-4697-91cc-b898558a458c"
  HABS_STORAGE: sthabshackweu
  HABS_TENANT_ID: 6fc0e479-449c-4700-b89c-7c4848058e30
  TRIAL_DATA: /tmp/trials
  SOURCE_JOB: ${{ inputs.source_job }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  run_p123:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(inputs.analysis == 'order-diagnostic' && '["order-diagnostic"]' || inputs.analysis == 'same-fit' && '["ridge-cell","reve-cell"]' || '["controls","ridge","reve"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt pyarrow "habs-hack[storage] @ git+https://github.com/HABS-BRAIN/habs-hack@main"
      - run: pip install --quiet --no-deps -e .
      - run: python tools/fetch_trial_table.py
      - name: Run Priorities 1-3 + Figure 1 coverage
        shell: bash
        run: |
          if [[ "$STAGE" == order-diagnostic ]]; then
            mkdir -p out_p123
            python tools/order_sensitivity.py "$TRIAL_DATA" out_p123/pub_revision_p123_metrics.json | tee run_p123.log
          else
            python -m habs_stress.pub_revision --data "$TRIAL_DATA" --out out_p123 --stage "$STAGE" --repeats "$REPEATS" 2>&1 | tee run_p123.log
          fi
        env:
          STAGE: ${{ matrix.stage }}
          REPEATS: ${{ inputs.repeats }}
      - uses: actions/upload-artifact@v4
        with:
          name: pub-revision-${{ matrix.stage }}
          path: |
            out_p123/pub_revision_p123_metrics.json
            run_p123.log
          retention-days: 30
