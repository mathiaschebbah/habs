name: Temporal study

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [feasibility, precision, study, audit]
        default: feasibility
        description: Structural audit, simulated precision, frozen study, or saved-report audit
      source_job:
        required: true
        default: "20261108T230726-28480a"
        description: Completed HABS job containing audited features and events

permissions:
  contents: read
  id-token: write

env:
  HABS_KEY: "1f4d7f20-8ba2-4697-91cc-b898558a458c"
  HABS_STORAGE: sthabshackweu
  HABS_TENANT_ID: 6fc0e479-449c-4700-b89c-7c4848058e30
  JOB_SUFFIX: ${{ inputs.source_job }}
  PRIVATE_INPUT_DEST: /tmp/habs-temporal/data
  HABS_ANALYSIS_OUT: /tmp/habs-temporal
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  feasibility:
    if: inputs.phase == 'feasibility' || inputs.phase == 'precision'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet "habs-hack[storage] @ git+https://github.com/HABS-BRAIN/habs-hack@main"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python tools/fetch_temporal_inputs.py
      - if: inputs.phase == 'feasibility'
        run: python tools/temporal_feasibility.py
      - if: inputs.phase == 'precision'
        run: python tools/temporal_precision.py
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-${{ inputs.phase }}
          path: /tmp/habs-temporal/public/
          if-no-files-found: error
          retention-days: 30

  build:
    if: inputs.phase == 'study'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      job: ${{ steps.submit.outputs.job }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "habs-hack[storage] @ git+https://github.com/HABS-BRAIN/habs-hack@main"
      - run: python tools/fetch_temporal_inputs.py
      - id: submit
        run: |
          source_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$source_dir"
          printf '%s\n' "$GITHUB_SHA" > "$source_dir/source_revision.txt"
          printf '%s\n' '{"study":"02_emotional_carryover"}' > "$source_dir/temporal_run.json"
          mkdir -p "$source_dir/.habs_inputs/data"
          cp -R "$PRIVATE_INPUT_DEST/." "$source_dir/.habs_inputs/data/"
          habs submit --source "$source_dir" --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --until built

  run:
    if: inputs.phase == 'study'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_SUFFIX: ${{ needs.build.outputs.job }}
      PRIVATE_OUTPUT_DEST: /tmp/habs-temporal-result
      FETCH_TEMPORAL_REPORTS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "habs-hack[storage] @ git+https://github.com/HABS-BRAIN/habs-hack@main"
      - run: habs watch "${HABS_KEY}--${JOB_SUFFIX}"
      - run: python tools/fetch_temporal_outputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-scientific-outputs
          path: /tmp/habs-temporal-result/public/
          if-no-files-found: error
          retention-days: 30

  audit:
    if: inputs.phase == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_OUTPUT_DEST: /tmp/habs-temporal-audit
      FETCH_TEMPORAL_REPORTS: "true"
      HABS_ANALYSIS_OUT: /out
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ env.HABS_KEY }}
          tenant-id: ${{ env.HABS_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet "habs-hack[storage] @ git+https://github.com/HABS-BRAIN/habs-hack@main"
      - run: pip install -r requirements.txt -r requirements-agent.txt
      - run: pip install -e .
      - run: python tools/fetch_temporal_outputs.py
      - name: Restore original private dataset references
        run: |
          test ! -e /out
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /out
          cp -R "$PRIVATE_OUTPUT_DEST/." /out/
      - name: Read-only report and likelihood audit
        run: |
          python -m vendor.run_cells audit/02_emotional_carryover.py scratch/audit/02_emotional_carryover/audit.md
          if rg -q '\*\*error:\*\*' scratch/audit/02_emotional_carryover/audit.md; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: audited-temporal-results
          path: |
            /out/public/
            scratch/audit/02_emotional_carryover/audit.md
          if-no-files-found: error
          retention-days: 30
